[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrom"
version = "0.7.9"
description = "Linux 原生 Android 线刷工具，支持欧加（OPPO/OnePlus/realme）设备"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Rovrry" }]
keywords = ["android", "rom", "flash", "fastboot", "adb", "oneplus", "oppo", "realme", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Rovrry/Lrom"
Repository = "https://github.com/Rovrry/Lrom"
Issues = "https://github.com/Rovrry/Lrom/issues"

[project.scripts]
lrom = "lrom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
